  <meta property="og:image" content="https://baekwangho.github.io/panchigi/join/assets/invite-600x600.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="판치기 같이 하자!">

  <script src="join.js" defer></script>

<body>
  <main class="invitation">
    <img class="hero" src="assets/invite-1200x630.png" width="1200" height="630" alt="판치기 로고 아래 친구를 기다리는 몽이와 동전">
    <div class="content">
      <p class="eyebrow">친구가 보낸 초대장</p>
      <h1>판치기 같이 하자!</h1>
      <p class="intro">링크 한 번이면 친구의 방으로 쏙.</p>
      <a id="open-app" class="primary" aria-disabled="true">판치기에서 방 들어가기</a>
      <p id="status" class="status" role="status" aria-live="polite">초대 코드를 확인하고 있어요.</p>
      <section class="code-area" aria-labelledby="code-title">
        <h2 id="code-title">초대 코드</h2>
        <p id="invite-code" class="code">—</p>
        <button id="copy-code" class="secondary" type="button" disabled>코드 복사</button>
      </section>
      <section class="install" aria-labelledby="install-title">
        <h2 id="install-title">아직 판치기가 없나요?</h2>
        <div class="stores">
          <button type="button" disabled><strong>Google Play</strong><span>곧 출시돼요</span></button>
          <button type="button" disabled><strong>App Store</strong><span>곧 출시돼요</span></button>
        </div>
        <p>설치한 뒤 이 링크를 다시 누르거나,<br>앱의 친구와 대전에서 코드를 붙여 넣어 주세요.</p>
      </section>
      <p class="footnote">초대는 방이 열려 있는 동안만 유효해요.<br>정원이 찼거나 만료된 방은 앱에서 안내해 드려요.</p>
      <noscript>앱에서 방에 들어가려면 JavaScript를 켜거나, 링크의 code 값을 복사해 친구와 대전에 붙여 넣어 주세요.</noscript>
    </div>
  </main>
  <footer>판치기 · 친구와 함께하는 작은 한 판</footer>
</body>
</html>
